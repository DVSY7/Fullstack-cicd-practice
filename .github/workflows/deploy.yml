name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 및 Docker Hub push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-server:latest ./server
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-client:latest ./client
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-client:latest

      - name: EC2에 배포
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Fullstack-cicd-practice
            git pull origin main
            docker compose down
            docker compose pull
            docker compose up -d