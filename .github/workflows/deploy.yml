name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

jobs:
  # CI 단계 - 테스트
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 1009
          MYSQL_DATABASE: mydb_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 설치
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 패키지 설치
        run: |
          cd server
          npm install

      - name: 테스트 실행
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: 1009
          DB_DATABASE: mydb_test
          REDIS_HOST: 127.0.0.1
        run: |
          cd server
          npm run test

  # CD 단계 - Staging 배포 (develop 브랜치)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' # develop 브랜치일 때만 실행

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 및 Docker Hub push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-server:staging ./server
          echo "VITE_API_URL=${{ secrets.STAGING_API_URL }}" > ./client/.env
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/cicd-client:staging ./client
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-server:staging
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-client:staging

      - name: AWS CLI 설정
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      # server-1 배포
      - name: server-1 Target Group 제외
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn ${{ secrets.STAGING_TARGET_GROUP_ARN }} \
            --targets Id=${{ secrets.STAGING_INSTANCE_ID_1 }}
          sleep 35

      - name: server-1 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/Fullstack-cicd-practice
            git pull origin develop
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d

      - name: server-1 헬스체크
        run: |
          sleep 30
          curl -f http://${{ secrets.STAGING_HOST }}:3000 || exit 1
      
      - name: server-1 Target Group 재등록
        run: |
          aws elbv2 register-targets \
            --target-group-arn ${{ secrets.STAGING_TARGET_GROUP_ARN }} \
            --targets Id=${{ secrets.STAGING_INSTANCE_ID_1 }}
          sleep 30
            
      # server-2 배포
      - name: server-2 Target Group 제외
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn ${{ secrets.STAGING_TARGET_GROUP_ARN }} \
            --targets Id=${{ secrets.STAGING_INSTANCE_ID_2 }}
          sleep 35

      - name: server-2 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST_2 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/Fullstack-cicd-practice
            git pull origin develop
            docker compose -f docker-compose.staging-server.yml down
            docker compose -f docker-compose.staging-server.yml pull
            docker compose -f docker-compose.staging-server.yml up -d
      
      - name: server-2 헬스체크
        run: |
          sleep 30
          curl -f http://${{ secrets.STAGING_HOST_2 }}:3000 || exit 1

      - name: server-2 Target Group 재등록
        run: |
          aws elbv2 register-targets \
            --target-group-arn ${{ secrets.STAGING_TARGET_GROUP_ARN }} \
            --targets Id=${{ secrets.STAGING_INSTANCE_ID_2}}

  # CD 단계 - Production 배포 (main 브랜치)
  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' # main 브랜치일 때만 실행

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 및 Docker Hub push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-server:latest ./server
          echo "VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}" > ./client/.env
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/cicd-client:latest ./client
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd-client:latest

      - name: Production EC2에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          debug: true
          script: |
            cd ~/Fullstack-cicd-practice
            git pull origin main
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
